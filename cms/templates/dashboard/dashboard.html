{% extends 'base.html' %} {% block content %}
<div class="space-y-8">
  <h1 class="text-3xl font-bold">Dashboard</h1>

  <!-- TikTok Streak -->
  <div class="bg-white p-4 rounded-lg shadow">
    <div class="flex gap-1">
      <h2 class="text-xl font-semibold mr-2">T</h2>

      {% for day in streak_data %}
      <div
        class="w-6 h-6 rounded {% if day.tiktok %}bg-pink-500{% else %}bg-gray-100{% endif %}"
      >
        <div class="text-[8px] text-center text-gray-500">
          {{ day.date|date:"d" }}
        </div>
      </div>
      {% endfor %}
    </div>
  </div>

  <!-- Twitter Streak -->
  <div class="bg-white p-4 rounded-lg shadow">
    <div class="flex gap-1">
      <h2 class="text-xl font-semibold mr-2">X</h2>

      {% for day in streak_data %}
      <div
        class="w-6 h-6 rounded {% if day.tweet %}bg-blue-500{% else %}bg-gray-100{% endif %}"
      >
        <div class="text-[8px] text-center text-gray-500">
          {{ day.date|date:"d" }}
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock %}
