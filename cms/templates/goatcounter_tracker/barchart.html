{% load lucide %}

<div class="flex flex-col gap-4">
    <div class="flex items-center justify-between">
        <h3 class="text-lg font-semibold">Page Views (Last 14 Days)</h3>
    </div>
    
    <div class="h-64">
        <canvas id="pageViewsChart"></canvas>
    </div>
</div>

{% if chart_data %}
    {{ chart_data|json_script:"chartData" }}
{% endif %}

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
let pageViewsChart = null;

function updateChart() {
    const chartData = JSON.parse(document.getElementById('chartData').textContent);
    const ctx = document.getElementById('pageViewsChart');
    
    if (pageViewsChart) {
        pageViewsChart.destroy();
    }
    
    pageViewsChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: chartData.dates,
            datasets: [{
                label: 'Page Views',
                data: chartData.views,
                backgroundColor: 'rgba(54, 162, 235, 0.5)',
                borderColor: 'rgba(54, 162, 235, 1)',
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        stepSize: 1
                    }
                }
            }
        }
    });
}

// Initial chart load
document.addEventListener('DOMContentLoaded', updateChart);
</script>
