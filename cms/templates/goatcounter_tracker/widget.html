{% load lucide %}

<div class="flex flex-col gap-4">
    <div class="flex items-center gap-4">
        <span class="font-semibold">GoatCounter ID:</span>
        <span>{{ goatcounter_tracker.goatcounter_id }}</span>
    </div>
    <div class="flex gap-4">
        <a href="https://{{ goatcounter_tracker.goatcounter_id }}.goatcounter.com" 
           target="_blank" 
           class="btn btn-primary gap-2">
            {% lucide "chart-column" size=16 %}
            View Analytics
        </a>
        <a href="{% url 'goatcounter_tracker_update' project.pk goatcounter_tracker.pk %}" 
           class="btn btn-outline gap-2">
            {% lucide "settings" size=16 %}
            Configure
        </a>
        <button onclick="updateStats()" 
                class="btn btn-outline gap-2">
            {% lucide "refresh-cw" size=16 %}
            Update Stats
        </button>
    </div>
</div>

<script>
function updateStats() {
    fetch("{% url 'goatcounter_tracker_stats' project.pk goatcounter_tracker.pk %}", {
        method: 'POST',
        headers: {
            'X-CSRFToken': '{{ csrf_token }}'
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === 'success') {
            console.log('Stats updated:', data.stats);
        } else {
            console.error('Failed to update stats:', data.message);
        }
    })
    .catch(error => {
        console.error('Error updating stats:', error);
    });
}
</script>
