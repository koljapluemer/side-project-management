{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">Links</h1>
        <a href="{% url 'link_create' %}" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
            Add New Link
        </a>
    </div>

    <div class="bg-white shadow-md rounded-lg overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Link</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Project</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
                {% for link in links %}
                <tr>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <a href="{{ link.url }}" target="_blank" class="text-blue-600 hover:text-blue-800">
                            {{ link.label|default:link.url }}
                        </a>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">{{ link.project.name|default:"No Project" }}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        <a href="{% url 'link_update' link.pk %}" class="text-indigo-600 hover:text-indigo-900 mr-3">Edit</a>
                        <form method="post" action="{% url 'link_delete' link.pk %}" class="inline">
                            {% csrf_token %}
                            <button type="submit" class="text-red-600 hover:text-red-900" 
                                    onclick="return confirm('Are you sure you want to delete this link?')">
                                Delete
                            </button>
                        </form>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3" class="px-6 py-4 text-center text-gray-500">
                        No links found. <a href="{% url 'link_create' %}" class="text-blue-600 hover:text-blue-800">Add one</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
